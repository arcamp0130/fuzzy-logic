<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital@0;1&display=swap" rel="stylesheet">
    <title>Amazing tip calculator</title>
</head>

<body>
    <header>
        <h1>Amazing tip calculator</h1>
    </header>
    <main>
        <div class="views container">
            <div class="inputs view">
                <h2>Fill all fields - be honest</h2>
                <form>

                </form>
            </div>
            <div class="results view">
                <h2>Results</h2>
                <div class="result container">
                    <span class="minor">You'll tip</span>
                    <span class="major" id="tip-percentage">00.00%</span>
                    <span class="minor">of your bill based on your preferences</span>
                </div>
                <hr>
                <div class="result container">
                    <span class="minor">This means that you'll pay</span>
                    <span class="major" id="final-bill">$0000.00</span>
                    <span class="minor">including your bill and tips, where</span>
                    <span class="major" id="tip-amount">$0000.00</span>
                    <span class="minor">is your tip</span>
                </div>
            </div>
        </div>
        <div class="controls container">
            <div class="buttons container">
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </div>
        </div>
    </main>
</body>
<script type="module" src="./ts/main.ts"></script>

</html>
